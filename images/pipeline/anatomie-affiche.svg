<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="titre desc"><title id="titre">Anatomie d'une affiche de sensibilisation</title><desc id="desc">Quatre zones : accroche et mini-titre, scène détournée avec un objet informatique visible, consigne, signature. Interdits : emojis, lexique cyber holographique, marqueurs de citation, phrases à la première personne.</desc><defs><marker id="f-4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="f-8b95a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b95a5"/></marker><marker id="f-38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="f-c4b5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="f-f87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="f-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0b0f0e"/><text x="40" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#e5e7eb" font-weight="700" text-anchor="start">Anatomie d'une affiche</text><text x="40" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#8b95a5" font-weight="400" text-anchor="start">Les règles métier que chaque affiche respecte.</text><rect x="40" y="104" width="270" height="400" rx="10" fill="#1b1730" stroke="#2a332f" stroke-width="1.5"/><rect x="56" y="120" width="238" height="68" rx="6" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.6" stroke-dasharray="5 4"/><circle cx="280" cy="134" r="10" fill="#0b0f0e" stroke="#fbbf24"/><text x="280" y="138.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#fbbf24" font-weight="700" text-anchor="middle">1</text><rect x="56" y="200" width="238" height="168" rx="6" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.6" stroke-dasharray="5 4"/><circle cx="280" cy="214" r="10" fill="#0b0f0e" stroke="#38bdf8"/><text x="280" y="218.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#38bdf8" font-weight="700" text-anchor="middle">2</text><rect x="56" y="380" width="238" height="74" rx="6" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.6" stroke-dasharray="5 4"/><circle cx="280" cy="394" r="10" fill="#0b0f0e" stroke="#34d399"/><text x="280" y="398.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#34d399" font-weight="700" text-anchor="middle">3</text><rect x="56" y="466" width="238" height="24" rx="6" fill="#8b95a5" fill-opacity="0.1" stroke="#8b95a5" stroke-opacity="0.6" stroke-dasharray="5 4"/><circle cx="280" cy="480" r="10" fill="#0b0f0e" stroke="#8b95a5"/><text x="280" y="484.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#8b95a5" font-weight="700" text-anchor="middle">4</text><text x="72" y="152" font-family="Georgia, serif" font-size="18" fill="#e5e7eb" font-weight="700" text-anchor="start">« Mon précieux… »</text><text x="72" y="174" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#fbbf24" font-weight="700" text-anchor="start">VOS IDENTIFIANTS</text><rect x="135" y="239" width="80" height="56" rx="5" fill="none" stroke="#38bdf8" stroke-width="2"/><path d="M160 311 h30 M175 295 v16" stroke="#38bdf8" stroke-width="2"/><rect x="165" y="264" width="20" height="16" rx="3" fill="#38bdf8" fill-opacity="0.5"/><path d="M169 264 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#38bdf8" stroke-width="2"/><text x="175.0" y="349" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#38bdf8" font-weight="500" text-anchor="middle">scène détournée + objet IT</text><text x="72" y="410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e5e7eb" font-weight="600" text-anchor="start">Ne partagez jamais</text><text x="72" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e5e7eb" font-weight="600" text-anchor="start">vos identifiants.</text><text x="72" y="482" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b95a5" font-weight="400" text-anchor="start">Service informatique</text><circle cx="352" cy="123" r="12" fill="#0b0f0e" stroke="#fbbf24" stroke-width="1.5"/><text x="352" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#fbbf24" font-weight="700" text-anchor="middle">1</text><text x="374" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" fill="#e5e7eb" font-weight="700" text-anchor="start">Accroche + mini-titre</text><text x="374" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">Le clin d'œil à l'univers détourné,</text><text x="374" y="169" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">et le sujet en deux mots.</text><circle cx="352" cy="207" r="12" fill="#0b0f0e" stroke="#38bdf8" stroke-width="1.5"/><text x="352" y="212" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#38bdf8" font-weight="700" text-anchor="middle">2</text><text x="374" y="212" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" fill="#e5e7eb" font-weight="700" text-anchor="start">Un objet informatique visible</text><text x="374" y="234" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">Sans lui, les premières affiches étaient</text><text x="374" y="253" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">jolies mais ne sensibilisaient à rien.</text><circle cx="352" cy="291" r="12" fill="#0b0f0e" stroke="#34d399" stroke-width="1.5"/><text x="352" y="296" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">3</text><text x="374" y="296" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" fill="#e5e7eb" font-weight="700" text-anchor="start">La consigne</text><text x="374" y="318" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">L'action attendue. Jamais optionnelle :</text><text x="374" y="337" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">c'est le message.</text><circle cx="352" cy="375" r="12" fill="#0b0f0e" stroke="#8b95a5" stroke-width="1.5"/><text x="352" y="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b95a5" font-weight="700" text-anchor="middle">4</text><text x="374" y="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" fill="#e5e7eb" font-weight="700" text-anchor="start">La signature</text><text x="374" y="402" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">Qui parle : le service informatique.</text><rect x="40" y="530" width="680" height="98" rx="12" fill="#1c1214" stroke="#f87171" stroke-width="1.5"/><text x="60" y="558" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#f87171" font-weight="700" text-anchor="start">Interdits : ils tirent l'image vers un rendu « fait par IA »</text><text x="60" y="586" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="400" text-anchor="start">✕  les emojis (dessinés tels quels)</text><text x="390" y="586" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="400" text-anchor="start">✕  le lexique « cyber holographique »</text><text x="60" y="610" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="400" text-anchor="start">✕  les marqueurs [cite: 1] de Gemini</text><text x="390" y="610" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="400" text-anchor="start">✕  toute phrase en « je » dans une sortie</text></svg>