<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" role="img" aria-labelledby="titre desc"><title id="titre">Méthode de test de la pipeline</title><desc id="desc">Boucle en quatre étapes : tester un cas réel, constater le défaut, trouver la cause, corriger la règle. Jour 1 : six tests réels et leurs correctifs. Jour 2 : onze tests, tous passés.</desc><defs><marker id="f-4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="f-8b95a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b95a5"/></marker><marker id="f-38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="f-c4b5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="f-f87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="f-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0b0f0e"/><text x="40" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#e5e7eb" font-weight="700" text-anchor="start">Corriger avec méthode, pas à l'intuition</text><text x="40" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#8b95a5" font-weight="400" text-anchor="start">Chaque défaut constaté suit la même boucle, jusqu'à ce que le test passe.</text><circle cx="220" cy="245" r="112" fill="none" stroke="#2a332f" stroke-width="1" stroke-dasharray="3 7"/><path d="M 279.4 150.0 A 112 112 0 0 1 317.0 189.0" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#f-f87171)"/><path d="M 317.0 301.0 A 112 112 0 0 1 279.4 340.0" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#f-fbbf24)"/><path d="M 160.6 340.0 A 112 112 0 0 1 123.0 301.0" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#f-38bdf8)"/><path d="M 123.0 189.0 A 112 112 0 0 1 160.6 150.0" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#f-34d399)"/><rect x="156" y="105" width="128" height="56" rx="12" fill="#141a18" stroke="#34d399" stroke-width="1.5"/><text x="220" y="129" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#34d399" font-weight="700" text-anchor="middle">1. Tester</text><text x="220" y="149" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b95a5" font-weight="500" text-anchor="middle">un cas réel</text><rect x="268" y="217" width="128" height="56" rx="12" fill="#141a18" stroke="#f87171" stroke-width="1.5"/><text x="332" y="241" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#f87171" font-weight="700" text-anchor="middle">2. Constater</text><text x="332" y="261" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b95a5" font-weight="500" text-anchor="middle">le défaut</text><rect x="156" y="329" width="128" height="56" rx="12" fill="#141a18" stroke="#fbbf24" stroke-width="1.5"/><text x="220" y="353" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#fbbf24" font-weight="700" text-anchor="middle">3. Trouver</text><text x="220" y="373" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b95a5" font-weight="500" text-anchor="middle">la cause</text><rect x="44" y="217" width="128" height="56" rx="12" fill="#141a18" stroke="#38bdf8" stroke-width="1.5"/><text x="108" y="241" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#38bdf8" font-weight="700" text-anchor="middle">4. Corriger</text><text x="108" y="261" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b95a5" font-weight="500" text-anchor="middle">la règle</text><text x="220" y="249" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="500" text-anchor="middle">jusqu'au</text><text x="220" y="267" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#34d399" font-weight="700" text-anchor="middle">test vert</text><text x="420" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#e5e7eb" font-weight="700" text-anchor="start">Jour 1 : six tests réels</text><text x="420" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="400" text-anchor="start">Visuel sans rapport avec l'IT</text><text x="434" y="187" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#34d399" font-weight="400" text-anchor="start">→ ancrage obligatoire</text><text x="420" y="214" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="400" text-anchor="start">Accroche seule, action incomprise</text><text x="434" y="233" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#34d399" font-weight="400" text-anchor="start">→ consigne visible</text><text x="420" y="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="400" text-anchor="start">Cadenas au rendu « emoji »</text><text x="434" y="279" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#34d399" font-weight="400" text-anchor="start">→ interdits anti-look IA</text><text x="420" y="306" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="400" text-anchor="start">Même mise en page partout</text><text x="434" y="325" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#34d399" font-weight="400" text-anchor="start">→ 3 options avant de choisir</text><text x="40" y="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#e5e7eb" font-weight="700" text-anchor="start">Jour 2 : la campagne de tests complète</text><rect x="40" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="66" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">0</text><text x="66" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="102" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="128" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">1</text><text x="128" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="164" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="190" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">2</text><text x="190" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="226" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="252" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">3</text><text x="252" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="288" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="314" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">4</text><text x="314" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="350" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="376" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">A</text><text x="376" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="412" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="438" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">B</text><text x="438" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="474" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="500" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">C</text><text x="500" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="536" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="562" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">D</text><text x="562" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="598" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="624" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">E</text><text x="624" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><rect x="660" y="456" width="52" height="46" rx="9" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/><text x="686" y="477" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">F</text><text x="686" y="494" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">✓</text><text x="40" y="532" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">11 tests passés : mono-style pur, campagne de trois affiches, retour ciblé</text><text x="40" y="552" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">(« change le médium »), rupture en collage papier.</text></svg>