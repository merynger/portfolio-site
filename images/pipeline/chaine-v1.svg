<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 886" role="img" aria-labelledby="titre desc"><title id="titre">La chaîne de production v1 : Cyrano, Archie, Shéhérazade</title><desc id="desc">Le message métier passe à Cyrano qui produit un brief, copié dans Archie qui produit un prompt, copié dans Shéhérazade qui dessine l'affiche et applique les retouches. Trois copier-collers par affiche.</desc><defs><marker id="f-4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="f-8b95a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b95a5"/></marker><marker id="f-38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="f-c4b5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="f-f87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="f-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0b0f0e"/><text x="40" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#e5e7eb" font-weight="700" text-anchor="start">Une affiche = trois copier-collers</text><text x="40" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#8b95a5" font-weight="400" text-anchor="start">Chaque assistant n'a qu'un métier ; l'utilisateur fait passer le relais.</text><rect x="40" y="104" width="330" height="64" rx="14" fill="#141a18" stroke="#2a332f" stroke-width="1.5"/><text x="60" y="131" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" fill="#e5e7eb" font-weight="700" text-anchor="start">Message métier</text><text x="60" y="154" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b95a5" font-weight="400" text-anchor="start" font-style="italic">« Verrouillez votre session en quittant votre poste »</text><rect x="420" y="104" width="300" height="64" rx="12" fill="#141a18" stroke="#2a332f" stroke-width="1.5" stroke-dasharray="5 5"/><text x="440" y="131" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#e5e7eb" font-weight="600" text-anchor="start">Journal des références (facultatif)</text><text x="440" y="152" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#8b95a5" font-weight="400" text-anchor="start">les univers déjà utilisés, collé à Cyrano</text><line x1="570" y1="170" x2="570" y2="220" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#f-6b7280)"/><line x1="205" y1="172" x2="205" y2="218" stroke="#6b7280" stroke-width="2" marker-end="url(#f-6b7280)"/><circle cx="230" cy="195" r="12" fill="#0b0f0e" stroke="#34d399" stroke-width="1.5"/><text x="230" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">1</text><text x="250" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">copier-coller du message</text><rect x="40" y="224" width="680" height="112" rx="14" fill="#141a18" stroke="#fbbf24" stroke-width="1.5"/><text x="62" y="260" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#fbbf24" font-weight="700" text-anchor="start">Cyrano</text><text x="62" y="284" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#e5e7eb" font-weight="500" text-anchor="start">trouve l'idée</text><rect x="62" y="300" width="66" height="21.5" rx="10.75" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/><text x="95.15" y="314.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#34d399" font-weight="600" text-anchor="middle">Express</text><rect x="146" y="300" width="52" height="21.5" rx="10.75" fill="#8b95a5" fill-opacity="0.12" stroke="#8b95a5" stroke-opacity="0.45"/><text x="172.25" y="314.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#8b95a5" font-weight="600" text-anchor="middle">Guidé</text><line x1="250" y1="242" x2="250" y2="318" stroke="#2a332f"/><text x="272" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· univers détourné</text><text x="497" y="268" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· accroche + consigne</text><text x="272" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· médium artistique</text><text x="497" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· objet IT à ancrer</text><line x1="205" y1="340" x2="205" y2="386" stroke="#6b7280" stroke-width="2" marker-end="url(#f-6b7280)"/><circle cx="230" cy="363" r="12" fill="#0b0f0e" stroke="#34d399" stroke-width="1.5"/><text x="230" y="368" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">2</text><text x="250" y="368" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">copier-coller du brief</text><rect x="40" y="392" width="680" height="112" rx="14" fill="#141a18" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="428" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#38bdf8" font-weight="700" text-anchor="start">Archie</text><text x="62" y="452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#e5e7eb" font-weight="500" text-anchor="start">écrit le prompt</text><rect x="62" y="468" width="66" height="21.5" rx="10.75" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/><text x="95.15" y="482.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#34d399" font-weight="600" text-anchor="middle">Express</text><rect x="146" y="468" width="52" height="21.5" rx="10.75" fill="#8b95a5" fill-opacity="0.12" stroke="#8b95a5" stroke-opacity="0.45"/><text x="172.25" y="482.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#8b95a5" font-weight="600" text-anchor="middle">Guidé</text><line x1="250" y1="410" x2="250" y2="486" stroke="#2a332f"/><text x="272" y="436" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· 202 briques de style</text><text x="497" y="436" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· 26 mises en page</text><text x="272" y="466" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· lisibilité du texte</text><text x="497" y="466" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· garde-fous du médium</text><line x1="205" y1="508" x2="205" y2="554" stroke="#6b7280" stroke-width="2" marker-end="url(#f-6b7280)"/><circle cx="230" cy="531" r="12" fill="#0b0f0e" stroke="#34d399" stroke-width="1.5"/><text x="230" y="536" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">3</text><text x="250" y="536" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">copier-coller du prompt</text><rect x="40" y="560" width="680" height="112" rx="14" fill="#141a18" stroke="#c4b5fd" stroke-width="1.5"/><text x="62" y="596" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#c4b5fd" font-weight="700" text-anchor="start">Shéhérazade</text><text x="62" y="620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#e5e7eb" font-weight="500" text-anchor="start">dessine et retouche</text><line x1="250" y1="578" x2="250" y2="654" stroke="#2a332f"/><text x="272" y="604" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· rendu Nano Banana 2</text><text x="497" y="604" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· textes et accents vérifiés</text><text x="272" y="634" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· une image par retouche</text><text x="497" y="634" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8b95a5" font-weight="400" text-anchor="start">· ponctuation conservée</text><path d="M 720 632 C 752 632 752 577 722 580" fill="none" stroke="#c4b5fd" stroke-width="1.5" marker-end="url(#f-c4b5fd)"/><line x1="205" y1="676" x2="205" y2="716" stroke="#34d399" stroke-width="2" marker-end="url(#f-34d399)"/><rect x="40" y="720" width="330" height="52" rx="12" fill="#0f1d17" stroke="#34d399" stroke-width="1.5"/><text x="60" y="752" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" fill="#34d399" font-weight="700" text-anchor="start">Affiche prête à diffuser</text><text x="420" y="742" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c4b5fd" font-weight="500" text-anchor="start" font-style="italic">Retouche : « garde l'univers,</text><text x="420" y="761" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#c4b5fd" font-weight="500" text-anchor="start" font-style="italic">change le médium » → nouvelle image</text><text x="40" y="796" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">Express : l'IA fait les choix recommandés en un tour. Guidé : question par question.</text><line x1="40" y1="814" x2="720" y2="814" stroke="#2a332f"/><text x="40" y="840" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">Règle tirée des tests : tout ce qu'un assistant écrit peut être copié dans le suivant,</text><text x="40" y="860" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">donc aucune consigne interne n'y est formulée à la première personne.</text></svg>