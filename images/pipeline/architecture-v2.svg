<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 748" role="img" aria-labelledby="titre desc"><title id="titre">Architecture de la v2 étudiée</title><desc id="desc">Un orchestrateur sur Google Cloud Run enchaîne Cyrano, Archie et Shéhérazade par l'API Gemini, un vérificateur indépendant contrôle chaque affiche avec 8 questions et 3 essais maximum. Les défauts récurrents sont tracés dans Google Sheets, un agent propose des corrections qui doivent passer le jeu de tests et l'accord d'un validateur.</desc><defs><marker id="f-4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker><marker id="f-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="f-8b95a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b95a5"/></marker><marker id="f-38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="f-c4b5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker><marker id="f-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="f-f87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="f-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0b0f0e"/><text x="40" y="50" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#e5e7eb" font-weight="700" text-anchor="start">La v2 étudiée</text><text x="40" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#8b95a5" font-weight="400" text-anchor="start">Plus de copier-coller, un contrôle indépendant. Proposition soumise à l'entreprise.</text><rect x="40" y="100" width="200" height="48" rx="14" fill="#141a18" stroke="#2a332f" stroke-width="1.5"/><text x="140" y="130" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#e5e7eb" font-weight="700" text-anchor="middle">Message métier</text><line x1="140" y1="150" x2="140" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#f-6b7280)"/><rect x="40" y="182" width="680" height="132" rx="16" fill="#0f1820" stroke="#38bdf8" stroke-width="1.5"/><text x="62" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16.5" fill="#38bdf8" font-weight="700" text-anchor="start">Orchestrateur</text><text x="190" y="210" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">Google Cloud Run + API Gemini</text><rect x="62" y="226" width="196" height="50" rx="10" fill="#141a18" stroke="#fbbf24" stroke-width="1.5"/><text x="160" y="257" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#fbbf24" font-weight="700" text-anchor="middle">Cyrano</text><line x1="260" y1="251" x2="278" y2="251" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f-6b7280)"/><rect x="280" y="226" width="196" height="50" rx="10" fill="#141a18" stroke="#38bdf8" stroke-width="1.5"/><text x="378" y="257" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#38bdf8" font-weight="700" text-anchor="middle">Archie</text><line x1="478" y1="251" x2="496" y2="251" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f-6b7280)"/><rect x="498" y="226" width="196" height="50" rx="10" fill="#141a18" stroke="#c4b5fd" stroke-width="1.5"/><text x="596" y="257" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#c4b5fd" font-weight="700" text-anchor="middle">Shéhérazade</text><text x="62" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">entre agents : des formulaires à cases fixes, plus de texte parasite copié</text><line x1="140" y1="316" x2="140" y2="344" stroke="#6b7280" stroke-width="2" marker-end="url(#f-6b7280)"/><rect x="40" y="348" width="330" height="96" rx="16" fill="#0f1d17" stroke="#34d399" stroke-width="1.5"/><text x="62" y="377" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#34d399" font-weight="700" text-anchor="start">Vérificateur indépendant</text><text x="62" y="402" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">8 questions oui / non</text><text x="62" y="424" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">3 essais au maximum</text><line x1="372" y1="396" x2="446" y2="396" stroke="#34d399" stroke-width="2" marker-end="url(#f-34d399)"/><rect x="450" y="370" width="160" height="52" rx="12" fill="#0f1d17" stroke="#34d399" stroke-width="1.5"/><text x="530" y="401" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#34d399" font-weight="700" text-anchor="middle">Affiche</text><path d="M 300 346 C 330 330 560 335 600 318" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#f-f87171)"/><text x="655" y="344" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#f87171" font-weight="600" text-anchor="middle">refusée :</text><text x="655" y="362" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#f87171" font-weight="600" text-anchor="middle">nouvel essai</text><text x="40" y="490" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#e5e7eb" font-weight="700" text-anchor="start">Amélioration sous contrôle</text><rect x="40" y="508" width="320" height="66" rx="12" fill="#141a18" stroke="#8b95a5" stroke-width="1.5"/><text x="58" y="536" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8b95a5" font-weight="700" text-anchor="start">1. Trace</text><text x="58" y="558" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">Google Sheets</text><rect x="400" y="508" width="320" height="66" rx="12" fill="#141a18" stroke="#fbbf24" stroke-width="1.5"/><text x="418" y="536" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#fbbf24" font-weight="700" text-anchor="start">2. Agent d'amélioration</text><text x="418" y="558" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">repère les défauts récurrents</text><rect x="40" y="594" width="320" height="66" rx="12" fill="#141a18" stroke="#38bdf8" stroke-width="1.5"/><text x="58" y="622" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#38bdf8" font-weight="700" text-anchor="start">3. Jeu de tests</text><text x="58" y="644" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">doit repasser au vert</text><rect x="400" y="594" width="320" height="66" rx="12" fill="#141a18" stroke="#34d399" stroke-width="1.5"/><text x="418" y="622" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#34d399" font-weight="700" text-anchor="start">4. Validateur</text><text x="418" y="644" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b95a5" font-weight="400" text-anchor="start">désigné par l'entreprise</text><line x1="362" y1="541" x2="398" y2="541" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f-6b7280)"/><path d="M 560 576 C 560 586 200 582 200 592" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f-6b7280)"/><line x1="362" y1="627" x2="398" y2="627" stroke="#6b7280" stroke-width="1.5" marker-end="url(#f-6b7280)"/><text x="40" y="704" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">Aucune correction n'entre en production sans passer le jeu de tests</text><text x="40" y="724" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" fill="#8b95a5" font-weight="400" text-anchor="start">et sans accord humain.</text></svg>